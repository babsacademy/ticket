[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; Railway (like most container platforms) injects configuration as real
; environment variables at runtime. PHP-FPM clears its environment by
; default, which would hide DB_URL/APP_KEY/etc. from every request — keep
; it disabled so `env()`/getenv() see what the platform actually set.
clear_env = no

; Conservative defaults for a small (512MB–1GB) container. Raise these if
; the Railway service is scaled up to a larger instance.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
