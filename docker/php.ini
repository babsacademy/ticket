; Production-oriented PHP overrides for the Railway runtime image.

date.timezone = Africa/Dakar

; Laravel already handles error rendering/logging itself (respecting
; APP_DEBUG) — never let PHP itself echo raw errors to the response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Match Nginx's client_max_body_size (event cover-image uploads, admin PDFs).
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

; OPcache — the single biggest win for PHP-FPM request latency in prod.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; A queue worker instance of this same image restarts jobs frequently —
; realpath cache reduces filesystem stat() overhead across both roles.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
