# Config-as-code for the "web" Railway service (the Laravel/Inertia app
# itself, served by Nginx + PHP-FPM). See docs/deployment-railway.md for the
# full setup — in particular, why the queue worker needs a SECOND Railway
# service pointed at railway.worker.toml rather than being defined here:
# Railway's config-as-code describes one deployable service per file, it
# has no syntax for declaring several independent services in one file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/usr/local/bin/deploy.sh"
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
